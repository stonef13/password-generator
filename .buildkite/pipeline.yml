steps:
  - label: ":xcode: Build"
    command: >
      xcodebuild build
      -project password-generator.xcodeproj
      -scheme password-generator
      -destination 'generic/platform=iOS Simulator'

  - label: ":test_tube: Unit Tests"
    command: >
      xcodebuild test
      -project password-generator.xcodeproj
      -scheme password-generator
      -destination 'generic/platform=iOS Simulator'
      -only-testing:password-generatorTests

  - label: ":iphone: UI Tests"
    command: >
      xcodebuild test
      -project password-generator.xcodeproj
      -scheme password-generator
      -destination 'generic/platform=iOS Simulator'
      -only-testing:password-generatorUITests
