name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26.4.1
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.4.1'
      - name: Build
        run: >
          xcodebuild build
          -project password-generator.xcodeproj
          -scheme password-generator
          -destination 'platform=iOS Simulator,name=iPhone 17'

  unit-tests:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26.4.1
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.4.1'
      - name: Boot simulator
        run: xcrun simctl boot "iPhone 17" || true
      - name: Unit Tests
        run: >
          xcodebuild test
          -project password-generator.xcodeproj
          -scheme password-generator
          -destination 'platform=iOS Simulator,name=iPhone 17'
          -only-testing:password-generatorTests

  ui-tests:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26.4.1
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.4.1'
      - name: Boot simulator
        run: xcrun simctl boot "iPhone 17" || true
      - name: UI Tests
        run: >
          xcodebuild test
          -project password-generator.xcodeproj
          -scheme password-generator
          -destination 'platform=iOS Simulator,name=iPhone 17'
          -only-testing:password-generatorUITests
