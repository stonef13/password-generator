name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 16.4
        run: sudo xcode-select -s /Applications/Xcode_16.4.app
      - name: Build
        run: >
          xcodebuild build
          -project password-generator.xcodeproj
          -scheme password-generator
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_REQUIRED=NO
          CODE_SIGNING_ALLOWED=NO

  unit-tests:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 16.4
        run: sudo xcode-select -s /Applications/Xcode_16.4.app
      - name: Find simulator
        id: sim
        run: |
          DEST=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for runtime, devices in data['devices'].items():
              for d in devices:
                  if d['isAvailable'] and 'iPhone' in d['name']:
                      print(f\"platform=iOS Simulator,name={d['name']},OS={runtime.split('.')[-1]}\")
                      sys.exit(0)
          ")
          echo "dest=$DEST" >> "$GITHUB_OUTPUT"
      - name: Build for testing
        run: >
          xcodebuild build-for-testing
          -project password-generator.xcodeproj
          -scheme password-generator
          -destination '${{ steps.sim.outputs.dest }}'
          -parallel-testing-enabled NO
          CODE_SIGNING_REQUIRED=NO
          CODE_SIGNING_ALLOWED=NO
      - name: Run unit tests
        run: >
          xcodebuild test-without-building
          -project password-generator.xcodeproj
          -scheme password-generator
          -destination '${{ steps.sim.outputs.dest }}'
          -only-testing:password-generatorTests
          -parallel-testing-enabled NO
          CODE_SIGNING_REQUIRED=NO
          CODE_SIGNING_ALLOWED=NO

  ui-tests:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 16.4
        run: sudo xcode-select -s /Applications/Xcode_16.4.app
      - name: Find simulator
        id: sim
        run: |
          DEST=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for runtime, devices in data['devices'].items():
              for d in devices:
                  if d['isAvailable'] and 'iPhone' in d['name']:
                      print(f\"platform=iOS Simulator,name={d['name']},OS={runtime.split('.')[-1]}\")
                      sys.exit(0)
          ")
          echo "dest=$DEST" >> "$GITHUB_OUTPUT"
      - name: Build for testing
        run: >
          xcodebuild build-for-testing
          -project password-generator.xcodeproj
          -scheme password-generator
          -destination '${{ steps.sim.outputs.dest }}'
          -parallel-testing-enabled NO
          CODE_SIGNING_REQUIRED=NO
          CODE_SIGNING_ALLOWED=NO
      - name: Run UI tests
        run: >
          xcodebuild test-without-building
          -project password-generator.xcodeproj
          -scheme password-generator
          -destination '${{ steps.sim.outputs.dest }}'
          -only-testing:password-generatorUITests
          -parallel-testing-enabled NO
          CODE_SIGNING_REQUIRED=NO
          CODE_SIGNING_ALLOWED=NO
