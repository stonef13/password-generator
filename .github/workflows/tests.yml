name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build and test
        timeout-minutes: 15
        run: |
          xcodebuild test \
            -scheme password-generator \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            | xcpretty && exit ${PIPESTATUS[0]}
