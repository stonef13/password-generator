name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Boot simulator
        run: |
          xcrun simctl boot "iPhone 17 Pro" || true
          for i in $(seq 1 30); do
            if xcrun simctl list devices booted | grep -q "iPhone 17 Pro"; then
              echo "Simulator booted"
              break
            fi
            echo "Waiting for simulator... ($i)"
            sleep 2
          done
          xcrun simctl list devices booted

      - name: Build and test
        timeout-minutes: 15
        run: |
          xcodebuild test \
            -scheme password-generator \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,arch=arm64' \
            -disable-concurrent-testing \
            | xcpretty && exit ${PIPESTATUS[0]}
